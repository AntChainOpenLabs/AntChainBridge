[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dioxide-tx-coordinator"
version = "1.0.0"
description = "Shared durable Dioxide transaction allocation for AntChainBridge"
requires-python = ">=3.9"
dependencies = ["PyMySQL>=1.1,<2"]

[tool.setuptools]
py-modules = ["dioxide_tx_coordinator"]
