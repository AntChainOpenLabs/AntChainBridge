spring:
  application:
    name: antchain-bridge-relayer
  profiles:
    active: env
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/relayer?serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    password: Mychain123!@#
    username: root
  redis:
    host: localhost
    port: 6379
#    password: Mychain123!@#

logging:
  file:
    path: ./logs

relayer:
  network:
    node:
      sig_algo: ED25519
      server:
        mode: https
      tls:
        private_key_path: file:tls_certs/relayer.key
        trust_ca_path: file:tls_certs/relayer.crt
      crosschain_cert_path: file:cc_certs/relayer.crt
      private_key_path: file:cc_certs/private_key.pem
  plugin_server_manager:
    grpc_auth:
      tls_client:
        ca_path: file:tls_certs/relayer.crt
        key_path: file:tls_certs/relayer.key
  # 注意core_validation.ptc_id要属于存在的PTC服务的id之一
  core_validation:
    ptc_id: ptc01
  platform_report:
    enabled: false
    endpoint: http://127.0.0.1:49200
    api_key_path: file:conf/platform-report-api-key
    connect_timeout_ms: 3000
    read_timeout_ms: 5000

# Optional per-message latency recorder; no automatic runtime activation.
experiment_metrics:
  enabled: false
